spring:
  application:
    name: aguia-branca-api
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://aguia:aguia-local@localhost:27017/aguia_branca?authSource=admin}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  max-http-request-header-size: 16KB

app:
  jwt:
    issuer: ${JWT_ISSUER:aguia-branca-api}
    secret: ${JWT_SECRET:local-development-secret-with-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.challenge.aguiabranca.api: ${LOG_LEVEL_APP:INFO}

